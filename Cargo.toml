[package]
name = "ubq"
version = "7.0.0"
edition = "2024"
rust-version = "1.92"
build = "build.rs"
autobins = false
description = "Lock-free unbounded MPMC queue with no_std + alloc support."
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/ubq"
repository = "https://github.com/Orkking2/UBQ"
keywords = ["queue", "mpmc", "lock-free", "concurrent", "channel"]
categories = ["concurrency", "data-structures", "no-std"]

[lib]
bench = false

[build-dependencies]
cc = "1"

[dependencies]
concurrent-queue = { version = "2", optional = true }
core_affinity = { version = "0.8", optional = true }
crossbeam-epoch = { version = "0.9", default-features = false, features = ["alloc"] }
crossbeam-queue = { version = "0.3.13", git = "https://github.com/Orkking2/crossbeam", branch = "batch", optional = true }
crossbeam-utils = { version = "0.8.21", default-features = false }
lfqueue = { version = "0.8.1", optional = true }
rbbq = { version = "0.1.0", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["rt", "sync", "time"], optional = true }
wcq = { version = "0.1.0", optional = true }
portable-atomic = { version = "1.13.1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.189", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_SystemInformation"] }

[patch.crates-io]
lfqueue = { git = "https://github.com/khyperia/lfqueue", branch = "allocscqring-usize" }

[features]
default = ["std","bench_tools"]
std = ["crossbeam-utils/std", "crossbeam-epoch/std"]
jni = ["std"]
bench_tools = [
    "std",
    "dep:clap",
    "dep:concurrent-queue",
    "dep:core_affinity",
    "dep:crossbeam-queue",
    "dep:portable-atomic",
    "dep:serde",
    "dep:serde_json",
    "dep:tokio",
]
bench_fastfifo = ["bench_tools", "dep:rbbq"]
bench_rbbq = ["bench_fastfifo"]
bench_lfqueue = ["bench_tools", "dep:lfqueue"]
bench_wcq = ["bench_tools", "dep:wcq"]
# Compiles third_party/moodycamel/shim.cpp via cc; requires a C++ compiler.
bench_moodycamel = ["bench_tools"]
# Compile the static UBQ variant registry into the benchmark harness.
bench_registry = ["bench_tools"]
# Experimental control: one completion RMW per item instead of one per block
# segment. A lab arm enables it through its `features` to A/B the two.
probe_item_completion = []
# Counts how often `pop_batch`'s post-reservation repair paths fire. Those
# branches are only reachable when the producer head appears to move backwards
# relative to a reservation the consumer already clamped against it, which
# requires a recycled block address to compare equal. Diagnostic only.
probe_batch_repair = []

[[bin]]
name = "bench_hardware"
path = "src/bin/bench_hardware.rs"
required-features = ["bench_tools"]

[[bin]]
name = "bench_atomic_updates"
path = "src/bin/bench_atomic_updates.rs"
required-features = ["bench_tools"]

[[bin]]
name = "bench_head_reload"
path = "src/bin/bench_head_reload.rs"
required-features = ["bench_tools"]

[[bin]]
name = "io_uring_queue_bench"
path = "src/bin/io_uring_queue_bench.rs"
required-features = ["bench_tools"]

[[bin]]
name = "laot"
path = "src/bin/long_atm_offset_test.rs"
required-features = ["bench_tools"]

[[bench]]
name = "push_batch"
harness = false
