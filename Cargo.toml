[package]
name = "ubq"
version = "1.0.0"
edition = "2024"
description = "Lock-free queue built from linked blocks for concurrent producers and consumers."
license = "MIT"

[dependencies]
atomic_list = "2.0.0"
crossbeam-utils = "0.8.21"
log = { version = "0.4", features = ["max_level_trace", "release_max_level_debug"] }

[features]
default = []
ubq_debug = []
bench_small = []
bench_medium = []
bench_large = []

[dev-dependencies]
criterion = { version = "0.8.1", features = ["html_reports"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync"] }
async-channel = "2.5"
crossbeam-channel = "0.5"
flume = "0.12"
env_logger = "0.11"
rand = "0.8"
paste = "1.0"
serde_json = "1"

[[bench]]
name = "ubq_perf"
harness = false
