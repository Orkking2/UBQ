[package]
name = "ubq"
version = "3.0.0"
edition = "2024"
description = "Lock-free unbounded MPMC queue backed by a linked ring of fixed-size blocks."
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/ubq"
keywords = ["queue", "mpmc", "lock-free", "concurrent", "channel"]
categories = ["concurrency", "data-structures"]

[lib]
bench = false

[dependencies]
crossbeam-utils = "0.8.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[features]
default = []
ubq_debug = []
bench_small = []
bench_medium = []
bench_large = []

[dev-dependencies]
crossbeam-queue = "0.3"
concurrent-queue = "2"

[[bench]]
name = "ubq_bench"
harness = false
