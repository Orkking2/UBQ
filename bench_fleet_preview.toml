[defaults]
runs_dir = "bench_results/presentation_runs"
plot_out_dir = "bench_results/presentation_plots"
remote_repo_dir = "~/UBQ"
remote_runs_dir = "bench_results/presentation_runs"
queues = ["ubq", "segqueue", "concurrent-queue", "rbbq", "lfqueue"]
modes = ["throughput"]
items_per_producer = [100000]
repeats = 1
fastfifo_block_sizes = [64, 256, 1024, 4096]
lfqueue_segment_sizes = [1024]
scenarios = ["1p4c", "4p4c", "16p16c", "64p64c"]
ubq_labels = ["balanced,8,127,crossbeam"]

[machines.local]
local = true
machine_label = "local-preview"

[machines.hebrides]
host = "hebrides"
machine_label = "hebrides-preview"

[machines.bsc-cns]
local = true
machine_label = "bsc-cns-preview"
