[defaults]
runs_dir = "bench_results/runs"
plot_out_dir = "bench_results/plots"
remote_repo_dir = "~/UBQ"
remote_runs_dir = "bench_results/runs"
queues = ["ubq", "segqueue", "concurrent-queue", "lfqueue"]
modes = ["throughput"]
items_per_producer = [100000]
repeats = 1
lfqueue_segment_sizes = [1024]
