[defaults]
runs_dir = "bench_results/lab_prelim_runs"
plot_out_dir = "bench_results/lab_prelim_plots"
remote_repo_dir = "~/UBQ"
remote_runs_dir = "bench_results/lab_prelim_runs"
queues = ["ubq", "segqueue", "concurrent-queue", "rbbq", "lfqueue", "wcq"]
modes = ["throughput", "complex_throughput", "data_latency", "fairness"]
items_per_producer = [1000000]
repeats = 1
fastfifo_block_sizes = [64, 256, 1024, 4096]
lfqueue_segment_sizes = [32, 256, 1024]
wcq_capacities = [4096, 65536, 1048576]
scenarios = [
  # Local i9-9900K coverage: every power-of-two grid point that fits 16 threads.
  "1p1c",
  "1p2c",
  "1p4c",
  "1p8c",
  "2p1c",
  "2p2c",
  "2p4c",
  "2p8c",
  "4p1c",
  "4p2c",
  "4p4c",
  "4p8c",
  "8p1c",
  "8p2c",
  "8p4c",
  "8p8c",

  # Grace-derived paper candidates for the larger hebrides machine.
  "1p16c",
  "1p32c",
  "1p64c",
  "16p16c",
  "32p32c",
  "64p64c",
  "16p32c",
  "32p16c",
  "32p64c",
  "64p32c",
  "64p16c",
]
ubq_labels = ["balanced,8,127,crossbeam"]

[machines.local]
local = true
machine_label = "local-lab-prelim"

[machines.hebrides]
host = "hebrides"
machine_label = "hebrides-prelim"
