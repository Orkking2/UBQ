[defaults]
bench_mode = "matrix"
runs_dir = "bench_results/ubq_matrix_runs"
plot_out_dir = "bench_results/ubq_matrix_plots"
remote_repo_dir = "~/UBQ"
remote_runs_dir = "bench_results/ubq_matrix_runs"
queues = ["ubq", "segqueue", "concurrent-queue"]
modes = ["throughput", "data_latency"]
items_per_producer = [1000000]
repeats = 1
scenarios = [
  "1p1c",
  "1p4c",
  "4p1c",
  "4p4c",
  "8p8c",
  "16p16c",
  "32p32c",
  "64p64c",
]

# All 128 UBQ variant combinations: 1 preset × 8 pool sizes × 8 block sizes × 2 backoff strategies.
# Format: balanced,{pool},{block},{backoff}
# pool=0 means no block recycling; non-zero values enable the recycling pool.
ubq_labels = [
  # pool=0 (no recycling)
  "balanced,0,31,crossbeam",   "balanced,0,31,yield",
  "balanced,0,63,crossbeam",   "balanced,0,63,yield",
  "balanced,0,127,crossbeam",  "balanced,0,127,yield",
  "balanced,0,255,crossbeam",  "balanced,0,255,yield",
